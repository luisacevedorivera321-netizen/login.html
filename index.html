<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RECICLAYA Login</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f8f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.contenedor{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
    text-align:center;
    width:350px;
}

img{
    width:100px;
    border-radius:50%;
    margin-bottom:10px;
}

button{
    background:#2e7d32;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    opacity:.9;
}

#perfil{
    display:none;
}
</style>
</head>

<body>

<div class="contenedor">

    <h1>♻️ RECICLAYA</h1>

    <div id="login">
        <p>Inicia sesión con Google</p>
        <button id="loginGoogle">Iniciar sesión</button>
    </div>

    <div id="perfil">
        <img id="foto">
        <h2 id="nombre"></h2>
        <p id="correo"></p>
        <button id="logout">Cerrar sesión</button>
    </div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyATKc_iMToh5GX5gR4sHINe2JA16bupd54",
  authDomain: "reciclaya-d8795.firebaseapp.com",
  projectId: "reciclaya-d8795",
  storageBucket: "reciclaya-d8795.firebasestorage.app",
  messagingSenderId: "337388568939",
  appId: "1:337388568939:web:98e8381762c0b02a834c2e",
  measurementId: "G-DFPQ12FZY7"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

let loginInProgress = false;

// LOGIN
document.getElementById("loginGoogle").addEventListener("click", () => {

    if (loginInProgress) return;
    loginInProgress = true;

    const provider = new firebase.auth.GoogleAuthProvider();

    auth.signInWithPopup(provider)
    .then((result) => {
        const user = result.user;

        document.getElementById("login").style.display = "none";
        document.getElementById("perfil").style.display = "block";

        document.getElementById("foto").src = user.photoURL;
        document.getElementById("nombre").textContent = user.displayName;
        document.getElementById("correo").textContent = user.email;
    })
    .catch((error) => {
        alert(error.message);
        console.log(error);
    })
    .finally(() => {
        loginInProgress = false;
    });

});

// LOGOUT
document.getElementById("logout").addEventListener("click", () => {
    auth.signOut().then(() => {
        document.getElementById("login").style.display = "block";
        document.getElementById("perfil").style.display = "none";
    });
});
</script>

</body>
</html>
