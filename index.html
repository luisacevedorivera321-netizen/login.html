<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RECICLAYA Login</title>

<style>
body{
    font-family: Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;

    background: linear-gradient(-45deg, #2e7d32, #43a047, #26c6da, #0288d1);
    background-size: 400% 400%;
    animation: gradientBG 10s ease infinite;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.contenedor{
    background: rgba(255,255,255,0.9);
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 25px rgba(0,0,0,.2);
    text-align:center;
    width:1100px;
    backdrop-filter: blur(10px);
}
    .panel{
    display:flex;
    gap:20px;
    margin-top:20px;
}

.menu{
    width:220px;
    display:flex;
    flex-direction:column;
}

.menu button{
    width:100%;
    margin-bottom:10px;
}

.contenido-panel{
    flex:1;
    background:white;
    border-radius:10px;
    padding:20px;
    text-align:left;
    min-height:300px;
}

img{
    width:100px;
    border-radius:50%;
    margin-bottom:10px;
    border: 3px solid #00c853;
}

button{
    background: linear-gradient(90deg, #00c853, #00b0ff);
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
    margin-top:10px;
    transition:0.3s;
}

button:hover{
    transform: scale(1.05);
    opacity:.9;
}

#perfil{
    display:none;
}
</style>
</head>

<body>

<div class="contenedor">

    <h1>♻️ RECICLAYA</h1>


    <div id="perfil">
        <img id="foto">
        <h2 id="nombre"></h2>
        <p id="correo"></p>
    </div>
  <div id="contenido" style="display:block;">

    <div class="panel">

        <div class="menu">
<button id="loginGoogle">🔑 Iniciar sesión</button>
            <button onclick="mostrarProductos()">📦 Productos</button>

<button onclick="mostrarPrecios()">💰 Precios</button>

<button onclick="mostrarNosotros()">ℹ️ Nosotros</button>

<button onclick="mostrarPerfil()">👤 Perfil</button>
            <button onclick="irFacebook()">👥 Comunidad</button>
            <button id="logout" style="display:none;">🚪 Cerrar sesión</button>
        </div>

        <div class="contenido-panel">

            <h2>Bienvenido a RECICLAYA ♻️</h2>

<p>
    Selecciona una opción del menú para comenzar.
</p>

        </div>

    </div>

</div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyATKc_iMToh5GX5gR4sHINe2JA16bupd54",
  authDomain: "reciclaya-d8795.firebaseapp.com",
  projectId: "reciclaya-d8795",
  storageBucket: "reciclaya-d8795.firebasestorage.app",
  messagingSenderId: "337388568939",
  appId: "1:337388568939:web:98e8381762c0b02a834c2e",
  measurementId: "G-DFPQ12FZY7"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
    auth.onAuthStateChanged((user) => {

    if(user){

        document.getElementById("foto").src = user.photoURL;
        document.getElementById("nombre").textContent = user.displayName;
        document.getElementById("correo").textContent = user.email;

        document.getElementById("logout").style.display = "block";
        document.getElementById("loginGoogle").style.display = "none";
        document.getElementById("perfil").style.display = "block";

    }else{

        document.getElementById("logout").style.display = "none";
        document.getElementById("loginGoogle").style.display = "block";
        document.getElementById("perfil").style.display = "none";

    }

});

let loginInProgress = false;

// LOGIN
document.getElementById("loginGoogle").addEventListener("click", () => {

    if (loginInProgress) return;
    loginInProgress = true;

    const provider = new firebase.auth.GoogleAuthProvider();

    auth.signInWithPopup(provider)
    .then((result) => {
        const user = result.user;

    

        document.getElementById("foto").src = user.photoURL;
        document.getElementById("nombre").textContent = user.displayName;
        document.getElementById("correo").textContent = user.email;

        document.getElementById("logout").style.display = "block";
        document.getElementById("loginGoogle").style.display = "none";
    })
    .catch((error) => {
        alert(error.message);
        console.log(error);
    })
    .finally(() => {
        loginInProgress = false;
    });

});

// LOGOUT
document.getElementById("logout").addEventListener("click", () => {
    auth.signOut().then(() => {

document.getElementById("logout").style.display = "none";
        document.getElementById("loginGoogle").style.display = "block";
        
        document.getElementById("foto").src = "";
        document.getElementById("nombre").textContent = "";
        document.getElementById("correo").textContent = "";

        document.querySelector(".contenido-panel").innerHTML = `
            <h2>Bienvenido a RECICLAYA ♻️</h2>
            <p>Selecciona una opción del menú para comenzar.</p>
        `;
    });
});
    function mostrarProductos(){
    document.querySelector(".contenido-panel").innerHTML = `
        <h2>📦 Productos</h2>
        <p>🧴 Botellas de plástico</p>
        <p>🥫 Latas de aluminio</p>
        <p>📦 Cartón reciclado</p>
    `;
}

function mostrarPrecios(){
    document.querySelector(".contenido-panel").innerHTML = `
        <h2>💰 Precios</h2>
        <p>Cobre — S/ 40.00 por kilo</p>
        <p>Bronce — S/ 20.00 por kilo</p>
        <p>Aluminio — S/ 5.00 por kilo</p>
        <p>Cartón — S/ 0.25 por kilo</p>
    `;
}

function mostrarNosotros(){
    document.querySelector(".contenido-panel").innerHTML = `
        <h2>ℹ️ Nosotros</h2>
        <p>
            RECICLAYA conecta ciudadanos y recicladores
            para promover el reciclaje y el cuidado del medio ambiente.
        </p>
    `;
}

function mostrarPerfil(){

    if(document.getElementById("nombre").textContent === ""){
        document.querySelector(".contenido-panel").innerHTML = `
            <h2>👤 Perfil</h2>
            <p>⚠️ No has iniciado sesión.</p>
        `;
        return;
    }

    document.querySelector(".contenido-panel").innerHTML = `
        <h2>👤 Perfil</h2>
        <img src="${document.getElementById("foto").src}" width="100">
        <p><strong>Nombre:</strong> ${document.getElementById("nombre").textContent}</p>
        <p><strong>Correo:</strong> ${document.getElementById("correo").textContent}</p>
    `;
}
    function irFacebook(){
    window.open(
        "https://www.facebook.com/groups/726601160841052/",
        "_blank"
    );
}
</script>

</body>
</html>
