<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RECICLAYA Login</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f8f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.contenedor{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
    text-align:center;
    width:350px;
}

img{
    width:100px;
    border-radius:50%;
    margin-bottom:10px;
}

button{
    background:#2e7d32;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

#perfil{
    display:none;
}

</style>
</head>

<body>

<div class="contenedor">

    <h1>♻️ RECICLAYA</h1>

    <div id="login">

        <p>Inicia sesión con Google</p>

        <button id="loginGoogle">
            Iniciar sesión
        </button>

    </div>

    <div id="perfil">

        <img id="foto">

        <h2 id="nombre"></h2>

        <p id="correo"></p>

        <button id="logout">
            Cerrar sesión
        </button>

    </div>

</div>

</body>
</html>
